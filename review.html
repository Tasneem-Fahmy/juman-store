<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آراء العملاء - جُمان</title>
        <link rel="icon" type="image/png" href="images/logo.jpeg">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background: #fdfaf6; text-align: center; padding: 20px; }
        .review-box { background: white; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { background: #d81b60; color: white; border: none; padding: 10px 30px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .reviews-display { margin-top: 30px; max-width: 500px; margin-left: auto; margin-right: auto; text-align: right; }
        .single-review { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 5px solid #d81b60; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="review-box">
        <h2>شاركينا رأيك 🌸</h2>
        <input type="text" id="userName" placeholder="اسمك الجميل">
        <textarea id="userReview" rows="4" placeholder="اكتبي رأيك هنا..."></textarea>
        <button onclick="sendReview()">إضافة الرأي</button>
    </div>

    <div class="reviews-display" id="reviewsList">
        <h3>ماذا قالوا عن جُمان؟ ✨</h3>
        </div>

    <script>
        // بياناتك الحقيقية من الصورة
        const firebaseConfig = {
            apiKey: "AIzaSyCCYRTxjQEfhv7XpdRd0l3IsVXGc4sjVOY",
            authDomain: "juman-store.firebaseapp.com",
            projectId: "juman-store",
            storageBucket: "juman-store.firebasestorage.app",
            messagingSenderId: "87430315002",
            appId: "1:87430315002:web:129bbb6e39c97ae1e37ab3",
            databaseURL: "https://juman-store-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function sendReview() {
            const name = document.getElementById('userName').value;
            const text = document.getElementById('userReview').value;

            if (name && text) {
                database.ref('reviews').push({
                    name: name,
                    text: text,
                    timestamp: Date.now()
                });
                document.getElementById('userName').value = '';
                document.getElementById('userReview').value = '';
                alert("تمت إضافة رأيك بنجاح! شكراً ليكي 💖");
            } else {
                alert("يا ريت تكتبي الاسم والرأي الأول 🌸");
            }
        }

        database.ref('reviews').on('value', (snapshot) => {
            const display = document.getElementById('reviewsList');
            display.innerHTML = '<h3>ماذا قالوا عن جُمان؟ ✨</h3>';
            snapshot.forEach((childSnapshot) => {
                const data = childSnapshot.val();
                display.innerHTML += `
                    <div class="single-review">
                        <strong>${data.name}</strong>
                        <p>${data.text}</p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>

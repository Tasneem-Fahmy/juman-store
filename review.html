<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>آراء عملاء جُمان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/logo.png">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #fdfaf6;
            text-align: center;
            padding: 50px;
            color: #4a3b32;
            margin: 0;
        }

        .review-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            margin: auto;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
        }

        button {
            background: #d81b60;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        button:hover {
            background: #5c4033;
        }

        #reviewsDisplay {
            margin-top: 40px;
            text-align: right;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .single-review {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border-right: 5px solid #d81b60;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <div class="review-box">
        <h2 style="color: #d81b60;">شاركينا رأيك 🌸</h2>
        <input type="text" id="userName" placeholder="اسمك الجميل">
        <textarea id="reviewText" placeholder="اكتبي رأيك هنا..." rows="4"></textarea>
        <button onclick="saveReview()">إضافة الرأي</button>
    </div>

    <div id="reviewsDisplay">
        <h3 style="text-align: center;">ماذا قالوا عن جُمان؟ ✨</h3>
        <div id="list"></div>
    </div>

    <script>
        // عرض الآراء أول ما الصفحة تفتح
        window.onload = function () {
            displayReviews();
        };

        function saveReview() {
            let name = document.getElementById("userName").value;
            let text = document.getElementById("reviewText").value;

            if (name.trim() === "" || text.trim() === "") {
                alert("برجاء كتابة الاسم والرأي 🌸");
                return;
            }

            // جلب الآراء القديمة من ذاكرة المتصفح
            let reviews = JSON.parse(localStorage.getItem("jumanReviews") || "[]");

            // إضافة الرأي الجديد
            reviews.push({ name: name, text: text });

            // حفظ في الـ localStorage
            localStorage.setItem("jumanReviews", JSON.stringify(reviews));

            // مسح الخانات وتحديث الشاشة
            document.getElementById("userName").value = "";
            document.getElementById("reviewText").value = "";
            displayReviews();
        }

        function displayReviews() {
            let reviews = JSON.parse(localStorage.getItem("jumanReviews") || "[]");
            let listHtml = "";

            // بنلف على المصفوفة ونرسم الآراء
            reviews.reverse().forEach(r => {
                listHtml += `<div class="single-review">
                                <strong>${r.name}:</strong>
                                <p>${r.text}</p>
                             </div>`;
            });

            document.getElementById("list").innerHTML = listHtml;
        }
    </script>
</body>

</html>
</body>

</html>

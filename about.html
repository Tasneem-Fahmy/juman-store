<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>من هم جُمان؟</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f4e1d2, #e9b0b3);
            text-align: center;
            padding: 50px;
            color: #5c4033;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .about-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        h1 {
            font-family: 'Amiri', serif;
            font-size: 4rem;
            margin-bottom: 10px;
            color: #d81b60;
        }

        p {
            font-size: 1.3rem;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="about-box">
        <h1>جُمان</h1>
        <p>
            ليس مجرد متجر للإكسسوارات، بل هو مساحة تتنفس بالجمال والرُقي.<br>
            نحن نؤمن أن كل قطعة تقتنيها يجب أن تروي قصة تشبهك، قصة مليئة بالتفاصيل الساحرة والخيال. <br>
            صُنعت قطعنا بحب لتليق بجمالك الداخلي وتزيده إشراقاً.
        </p>
    </div>
</body>

</html>
